{% extends "base.html" %}

{% block meta %}
    <title>Tambah Prestasi - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main class="achievement-page">
        <section>
            <div class="container">
                <h1>Tambah Prestasi</h1>

                <form
                    method="post"
                    action="{% url 'main:create_achievement' %}"
                    class="achievement-form"
                >
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="achievement-button">
                        Tambah Prestasi
                    </button>

                    <a
                        href="{% url 'main:show_achievements' %}"
                        class="achievement-button achievement-button-secondary"
                    >
                        Batal
                    </a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
